name: Build Vertex APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o Vertex.zip || true
          if [ -d temp ]; then
            shopt -s dotglob
            mv temp/*. 2>/dev/null || true
            rm -rf temp
          fi
      - name: Fix old Gradle file
        run: |
          sed -i 's/flutter\.versionCode/flutterVersionCode/g' android/app/build.gradle || true
          sed -i 's/flutter\.versionName/flutterVersionName/g' android/app/build.gradle || true
          sed -i 's/flutterVersionCode/flutterVersionCode.toInteger()/g' android/app/build.gradle
          sed -i 's/\.toInteger()\.toInteger()/\.toInteger()/g' android/app/build.gradle
          cat android/app/build.gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Vertex-APK
          path: build/app/outputs/flutter-apk/app-release.apk
