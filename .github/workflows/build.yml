name: Build Vertex APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o Vertex.zip || true
          if [ -d temp ]; then
            cp -r temp/..
            rm -rf temp
          fi
      - name: Fix gradle
        run: |
          sed -i 's/flutter.versionCode/flutterVersionCode/g' android/app/build.gradle || true
          sed -i 's/flutter.versionName/flutterVersionName/g' android/app/build.gradle || true
          sed -i 's/flutterVersionCode/flutterVersionCode.toInteger()/g' android/app/build.gradle
          sed -i 's/\.toInteger()\.toInteger()/.toInteger()/g' android/app/build.gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Vertex-APK
          path: build/app/outputs/flutter-apk/app-release.apk
