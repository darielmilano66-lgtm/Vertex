name: Build Flutter APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract ZIP and fix build.gradle.kts
        run: |
          # 1. Descomprimir el archivo
          unzip -o Vertex.zip -d extracted

          # 2. Encontrar android/app/build.gradle.kts sin importar la profundidad de carpetas
          GRADLE_FILE=$(find extracted -type f -path "*/android/app/build.gradle.kts" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: No se encontro android/app/build.gradle.kts"
            exit 1
          fi

          echo "Parchando archivo: $GRADLE_FILE"

          # 3. Aplicar el parche con sed especificamente para versionCode y versionName
          sed -i 's/flutter\.versionCode/flutter.versionCode()/g' "$GRADLE_FILE"
          sed -i 's/flutter\.versionName/flutter.versionName()/g' "$GRADLE_FILE"

          # 4. Localizar la carpeta raiz donde esta pubspec.yaml y guardarla en la variable de entorno
          PUBSPEC_PATH=$(find extracted -type f -name "pubspec.yaml" | head -n 1)
          PROJECT_ROOT=$(dirname "$PUBSPEC_PATH")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
