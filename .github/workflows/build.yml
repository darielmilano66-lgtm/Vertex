name: Build Vertex APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Unzip
        run: |
          unzip -o Vertex.zip -d t
          shopt -s dotglob
          if [ -d "t/Vertex" ]; then mv t/Vertex/*.; else mv t/*/*. 2>/dev/null || mv t/*.; fi
          rm -rf t Vertex.zip
          ls -la
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Vertex-APK
          path: build/app/outputs/flutter-apk/app-release.apk
