name: Build Vertex APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Vertex.zip -d. || true
      - name: Fix gradle
        run: |
          FILE=$(find. -name "build.gradle.kts" | head -n 1)
          echo "Encontrado $FILE"
          sed -i 's/flutter.versionCode/flutter.versionCode()/g' $FILE
          sed -i 's/flutter.versionName/flutter.versionName()/g' $FILE
          sed -i 's/()()/()/g' $FILE
          cat $FILE | sed -n '28,32p'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Vertex-APK
          path: build/app/outputs/flutter-apk/app-release.apk
