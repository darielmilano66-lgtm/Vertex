name: Build Flutter APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Extract ZIP, patch gradle and disable newDsl
        run: |
          # 1. Descomprimir el archivo
          unzip -o Vertex.zip -d extracted

          # 2. Encontrar android/app/build.gradle.kts
          GRADLE_FILE=$(find extracted -type f -path "*/android/app/build.gradle.kts" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: No se encontro android/app/build.gradle.kts"
            exit 1
          fi

          echo "Parchando archivo: $GRADLE_FILE"

          # 3. Aplicar el parche con sed para versionCode y versionName
          sed -i 's/flutter\.versionCode/flutter.versionCode()/g' "$GRADLE_FILE"
          sed -i 's/flutter\.versionName/flutter.versionName()/g' "$GRADLE_FILE"

          # 4. Localizar la carpeta raiz del proyecto donde esta pubspec.yaml
          PUBSPEC_PATH=$(find extracted -type f -name "pubspec.yaml" | head -n 1)
          PROJECT_ROOT=$(dirname "$PUBSPEC_PATH")

          # 5. Agregar android.newDsl=false a $PROJECT_ROOT/android/gradle.properties
          GRADLE_PROPERTIES="$PROJECT_ROOT/android/gradle.properties"

          if [ -f "$GRADLE_PROPERTIES" ]; then
            echo "Añadiendo android.newDsl=false a $GRADLE_PROPERTIES"
            echo "android.newDsl=false" >> "$GRADLE_PROPERTIES"
          else
            echo "Creando $GRADLE_PROPERTIES con android.newDsl=false"
            mkdir -p "$PROJECT_ROOT/android"
            echo "android.newDsl=false" > "$GRADLE_PROPERTIES"
          fi

          # Guardar PROJECT_ROOT para los siguientes pasos
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
